<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Modüler CSS Katmanları (Cascade Sırası) -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/front.css">
    <link rel="stylesheet" href="css/back.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <!-- Üst Menü Barı (Top Nav) -->
    <header class="top-nav">
        <a href="/" class="top-nav-brand" id="topNavHome" title="Landing Page">
            <span class="nav-logo">N</span>
            <span class="nav-brand-text">Nook</span>
        </a>
        <div class="top-nav-actions">
            <button class="top-nav-btn" id="authTriggerBtn" title="Hesabım">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span id="authBtnText">Giriş Yap</span>
            </button>
        </div>
    </header>

    <!-- Arka plan ortamı -->
    <div class="ambient-background"></div>

    <!-- Sahne ve 5:7 Kart Kapsayıcısı -->
    <main class="stage">
        <div class="card-container" id="cardContainer">
            <div class="nook-card" id="nookCard">
                
                <!-- ÖN YÜZ (VİTRİN) -->
                <section class="card-face card-front" id="cardFront">
                    <button class="flip-trigger-btn" id="flipToBackBtn" aria-label="Menüyü Aç" title="Menüyü Gör">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12v-3a3 3 0 0 1 3-3h13m0 0l-4-4m4 4l-4 4"></path>
                            <path d="M20 12v3a3 3 0 0 1-3 3H4m0 0l4 4m-4-4l4-4"></path>
                        </svg>
                    </button>

                    <!-- 1. Bölge: Üst Kimlik -->
                    <header class="identity-zone">
                        <div class="banner-box">
                            <img src="" alt="Banner" class="banner-img" id="bannerImg">
                        </div>
                        <div class="avatar-box">
                            <img src="" alt="Avatar" class="avatar-img" id="avatarImg">
                        </div>
                        <h1 class="profile-name" id="profileName">-</h1>
                        <p class="profile-title" id="profileTitle">-</p>
                    </header>

                    <!-- 2. Bölge: Esnek Gövde (Alıntı / Bio) -->
                    <div class="bio-zone">
                        <p class="profile-bio" id="profileBio">-</p>
                    </div>

                    <!-- 3. Bölge: Taban (Tag Izgarası) -->
                    <footer class="tags-zone">
                        <div class="tags-grid" id="tagsGrid"></div>
                    </footer>
                </section>

                <!-- ARKA YÜZ (DRILL-DOWN NAVİGASYON) -->
                <section class="card-face card-back" id="cardBack">
                    <button class="flip-trigger-btn" id="flipToFrontBtn" aria-label="Ön Yüze Dön" title="Ön Yüze Dön">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>

                    <!-- Görünüm Yöneticisi Sahnesi -->
                    <div class="views-wrapper" id="viewsWrapper">
                        <!-- Kök Menü -->
                        <div class="view-panel view-menu active" id="viewMenu">
                            <div class="menu-header">
                                <h2 class="menu-owner-name" id="menuOwnerName">-</h2>
                            </div>
                            <nav class="menu-nav" id="menuNav"></nav>
                        </div>
                        <!-- Alt Ekranlar RenderEngine tarafından dinamik üretilir -->
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- AUTH MODAL (GİRİŞ & KAYIT) -->
    <div id="authModal" class="auth-modal">
        <div class="auth-modal-backdrop" id="authModalBackdrop"></div>
        <div class="auth-modal-box">
            <div class="auth-modal-header">
                <h3 class="auth-modal-title" id="authTitle">Giriş Yap</h3>
                <button class="auth-modal-close" id="authModalClose" aria-label="Kapat">&times;</button>
            </div>

            <form class="auth-form" id="authForm" onsubmit="return false;">
                <div class="auth-input-group" id="authUsernameGroup" style="display: none;">
                    <input type="text" id="authUsername" class="auth-input" placeholder="Kullanıcı Adı (Örn: apdi)" autocomplete="username">
                </div>
                <div class="auth-input-group">
                    <input type="email" id="authEmail" class="auth-input" placeholder="E-posta" autocomplete="email">
                </div>
                <div class="auth-input-group">
                    <input type="password" id="authPassword" class="auth-input" placeholder="Şifre" autocomplete="current-password">
                </div>
                
                <div class="auth-error-box" id="authErrorBox" style="display: none;"></div>

                <button type="submit" id="authSubmitBtn" class="auth-submit-btn">Giriş Yap</button>

                <div class="auth-switch">
                    <span id="authSwitchText">Hesabın yok mu?</span>
                    <button type="button" id="authSwitchBtn" class="auth-switch-btn">Kayıt Ol</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modüler JS Katmanları -->
    <script src="js/config.js"></script>
    <script src="js/render.js"></script>
    <script src="js/router.js"></script>
    <script src="js/tilt.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
